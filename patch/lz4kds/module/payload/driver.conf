# zram0 用哪个压缩算法。lz4kd 由内核自带（CONFIG_CRYPTO_LZ4KD），
# 前提是刷的是本仓库编译的 Image。
algo=lz4kd

# mode=algo     只写 comp_algorithm，不装卸模块。
# mode=replace  换成本模块自带的驱动，能拿到 SDDC 与 lz4kds。厂商驱动的
#               module_exit 只删 zram 设备，它注册的七个 android_vh 探针
#               留在内核里，回调地址指向它已被释放的代码段。
mode=algo

# mode=replace 时这几个参数交给 insmod。
insmod oplus_bsp_hybridswap_zram.ko zram_size_mb=16384 zram_algo=lz4kds
